name: CHUD Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-studio:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Build and test CHUD and Studio
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CHUD-Windows-development
          path: |
            build/bin/*.exe
            build/studio*.png
            studio/dist/
            runtime/src/core.c
          retention-days: 14
